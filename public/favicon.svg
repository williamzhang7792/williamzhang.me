<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="#C9B998" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- cork (filled to anchor the mark at small sizes) -->
  <ellipse cx="16" cy="25" rx="3" ry="2" fill="#C9B998" />
  <!-- feathers fanning out from the cork -->
  <line x1="13.5" y1="23.5" x2="9" y2="7" />
  <line x1="14.8" y1="23" x2="13.5" y2="6" />
  <line x1="16" y1="23" x2="16" y2="5.5" />
  <line x1="17.2" y1="23" x2="18.5" y2="6" />
  <line x1="18.5" y1="23.5" x2="23" y2="7" />
  <!-- top arc suggesting the cone opening -->
  <path d="M9 7 Q 16 4.5 23 7" />
</svg>
