<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- shuttlecock cork (the rounded base at the bottom) -->
  <ellipse cx="12" cy="18.5" rx="2.4" ry="1.6" />
  <!-- cork rim -->
  <line x1="9.6" y1="18.5" x2="14.4" y2="18.5" />
  <!-- feathers fanning out from cork -->
  <line x1="10" y1="17.6" x2="6.5" y2="4" />
  <line x1="11" y1="17.4" x2="9.75" y2="3.25" />
  <line x1="13" y1="17.4" x2="14.25" y2="3.25" />
  <line x1="14" y1="17.6" x2="17.5" y2="4" />
  <!-- center spine feather -->
  <line x1="12" y1="17.3" x2="12" y2="3" />
  <!-- feather tip arc to suggest the cone opening -->
  <path d="M6.5 4 Q 12 2.4 17.5 4" />
</svg>
